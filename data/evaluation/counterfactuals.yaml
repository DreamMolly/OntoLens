version: synthetic-counterfactual-v1
description: >-
  Synthetic metamorphic cases for the source-bound workspace decision contract.
  After any declared synthetic setup, each variant changes exactly one fact; this fixture is
  diagnostic and is deliberately separate from regression/incident/heldout gold.
cases:
  - id: CF-UNIT-001
    category: unit
    base:
      request_id: CF-UNIT-001
      requester_id: stu01
      lot_id: lot_eth
      quantity: 100
      destination_cabinet_id: cab_flam
      unit: mL
      as_of: '2026-09-28'
    variant:
      path: request.unit
      value: g
    changed_path: request.unit
    expected:
      base: {status: ready, unit: mL, decision: {action: ALLOW, approved_quantity: 100, reason_code: ALLOWED, rule_version: v2}}
      variant: {status: needs_review, unit: null, decision: null, review_reason_code: UNIT_MISMATCH}

