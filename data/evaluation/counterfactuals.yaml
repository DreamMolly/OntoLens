      unit: mL
      as_of: '2026-09-28'
    variant:
      path: catalog.lots.lot_eth.on_hand
      value: 20
    changed_path: catalog.lots.lot_eth.on_hand
    expected:
      base: {status: ready, unit: mL, decision: {action: ALLOW, approved_quantity: 100, reason_code: ALLOWED, rule_version: v2}}
      variant: {status: ready, unit: mL, decision: {action: LIMIT, approved_quantity: 20, reason_code: STOCK_SHORT, rule_version: v2}}

